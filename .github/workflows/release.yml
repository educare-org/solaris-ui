name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_BRANCH: ${{ github.ref_name }}

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read local package metadata
        id: local
        run: >-
          node -e 'const fs = require("node:fs"); const pkg = require("./packages/angular/package.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "name=" + pkg.name + "\nversion=" + pkg.version + "\n");'

      - name: Read published package version
        id: published
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.name }}
        run: >-
          node -e 'const fs = require("node:fs"); const { execSync } = require("node:child_process"); let version = ""; try { version = execSync("npm view " + process.env.PACKAGE_NAME + " version", { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim(); } catch {} fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");'

      - name: Skip already published version
        if: steps.local.outputs.version == steps.published.outputs.version
        run: >-
          node -e 'console.log(process.env.PACKAGE_NAME + "@" + process.env.PACKAGE_VERSION + " is already published. Skipping release.");'
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.name }}
          PACKAGE_VERSION: ${{ steps.local.outputs.version }}

      - name: Install dependencies
        if: steps.local.outputs.version != steps.published.outputs.version
        run: pnpm install --frozen-lockfile

      - name: Run verification
        if: steps.local.outputs.version != steps.published.outputs.version
        run: pnpm verify

      - name: Build release artifact
        if: steps.local.outputs.version != steps.published.outputs.version
        run: pnpm build:lib

      - name: Validate package artifact
        if: steps.local.outputs.version != steps.published.outputs.version
        run: pnpm package:check

      - name: Publish package
        if: steps.local.outputs.version != steps.published.outputs.version
        run: npm publish dist/packages/angular --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.local.outputs.version != steps.published.outputs.version
        env:
          PACKAGE_NAME: ${{ steps.local.outputs.name }}
          PACKAGE_VERSION: ${{ steps.local.outputs.version }}
        run: |
          tag="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi
