name: E2E Full

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          browsers: chromium
          install-deps: 'false'
          save-cache: 'false'

      - name: Build showcase
        run: pnpm nx build showcase

      - name: Upload showcase dist
        uses: actions/upload-artifact@v4
        with:
          name: showcase-dist
          path: dist/apps/showcase/browser/
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
          install-deps: 'true'
          save-cache: 'false'

      - name: Download showcase dist
        uses: actions/download-artifact@v4
        with:
          name: showcase-dist
          path: dist/apps/showcase/browser/

      - name: Run E2E (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
        run: pnpm exec playwright test -c apps/showcase-e2e/playwright.config.mts --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=2 --reporter=blob

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  report:
    name: Merge reports
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          browsers: chromium
          install-deps: 'false'
          save-cache: 'false'

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
