name: setup
description: Shared Node/pnpm/Nx/Playwright setup for Solaris UI workflows

inputs:
  browsers:
    description: Playwright browsers to install (space separated) or "all"
    required: false
    default: chromium
  install-deps:
    description: Install Playwright OS dependencies with --with-deps
    required: false
    default: 'true'
  save-cache:
    description: Save Nx cache at the end of the job
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Derive SHAs for Nx
      uses: nrwl/nx-set-shas@v4

    - name: Restore Nx cache
      uses: actions/cache/restore@v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-

    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        INSTALL_DEPS: ${{ inputs.install-deps }}
      run: |
        if [ "$BROWSERS" = "all" ]; then
          if [ "$INSTALL_DEPS" = "true" ]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install
          fi
        else
          # shellcheck disable=SC2086
          if [ "$INSTALL_DEPS" = "true" ]; then
            pnpm exec playwright install --with-deps $BROWSERS
          else
            pnpm exec playwright install $BROWSERS
          fi
        fi

    - name: Save Nx cache
      if: inputs.save-cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.sha }}
