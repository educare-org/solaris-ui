@if (isStacked()) {
  <svg class="solaris-spinner__ring" aria-hidden="true" viewBox="0 0 120 120">
    @for (bar of stackedBars; track bar.x1) {
      <line
        class="solaris-spinner__bar"
        [attr.x1]="bar.x1"
        [attr.y1]="bar.y1"
        [attr.x2]="bar.x2"
        [attr.y2]="bar.y2"
        [style.--solaris-spinner-stacked-step]="bar.delayFactor"
        [style.opacity]="bar.staticOpacity"
      ></line>
    }
  </svg>
} @else {
  <svg class="solaris-spinner__ring" aria-hidden="true" viewBox="0 0 120 120">
    <circle class="solaris-spinner__track" cx="60" cy="60" r="46"></circle>
    @if (isProgress()) {
      <circle
        class="solaris-spinner__indicator solaris-spinner__indicator--progress"
        cx="60"
        cy="60"
        r="46"
        pathLength="100"
        [attr.stroke-dasharray]="indicatorDashArray()"
      ></circle>
    } @else {
      <g class="solaris-spinner__indicator">
        <path class="solaris-spinner__arc" [attr.d]="ringArcPath"></path>
      </g>
    }
  </svg>
}
@if (isProgress()) {
  <span class="solaris-spinner__content">
    <span class="solaris-spinner__header">
      @if (showPercent()) {
        <span class="solaris-spinner__percent">{{ clampedValue() }}%</span>
      }
      @if (resolvedLabel(); as label) {
        <span class="solaris-spinner__label">{{ label }}</span>
      }
    </span>
    @for (line of resolvedDescription(); track $index) {
      <span class="solaris-spinner__description">{{ line }}</span>
    }
  </span>
} @else if (resolvedLabel(); as label) {
  <span class="solaris-spinner__label">{{ label }}</span>
}
