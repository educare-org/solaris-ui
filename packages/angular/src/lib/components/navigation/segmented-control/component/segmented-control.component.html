<div class="solaris-segmented-control__container">
  <ng-content select="solaris-segmented-item" />

  @if (indicator() && hasValue()) {
    <div
      class="solaris-segmented-control__indicator"
      [class.solaris-segmented-control__indicator--animate]="indicatorReady()"
      [class.solaris-segmented-control__indicator--vertical]="
        orientation() === 'vertical'
      "
      [style.transform]="
        orientation() === 'vertical'
          ? indicatorTransformY()
          : indicatorTransformX()
      "
      [style.width]="orientation() === 'vertical' ? '' : indicatorWidth()"
      [style.height]="orientation() === 'vertical' ? indicatorHeight() : ''"
    ></div>
  }
</div>
