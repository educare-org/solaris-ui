<solaris-form-field
  [control]="this"
  [radius]="radius()"
  [hint]="hintText()"
  [label]="labelText()"
  [error]="errorText()"
  solaris-popover-trigger
  [appearance]="appearance()"
  [required]="requiredInput()"
  [density]="effectiveDensity()"
  [size]="size()"
  [solarisPopoverPadding]="'md'"
  [solarisPopoverAlign]="'start'"
  [solarisPopoverRadius]="radius()"
  [invalid]="isEffectivelyInvalid()"
  [disabled]="isEffectivelyDisabled()"
  [readonly]="isEffectivelyReadonly()"
  [loading]="loading()"
  [hasSuffixAction]="!!projectedSuffixAction()"
  [prefix]="prefix()"
  [suffix]="suffix()"
  [suffixActionTemplate]="calendarTriggerTemplate"
  [suffixTemplate]="clearTemplate"
  [solarisPopoverPlacement]="'bottom'"
  [solarisPopoverAriaHasPopup]="'dialog'"
  (solarisPopoverOpened)="onPanelOpened()"
  (solarisPopoverClosed)="onPanelClosed()"
  [solarisPopoverTriggerFor]="calendarPopover"
  [solarisPopoverDisabled]="isEffectivelyDisabled() || isEffectivelyReadonly()"
>
  <ng-content
    select="[solaris-form-prefix]"
    ngProjectAs="[solaris-form-prefix]"
  />
  <ng-content
    select="[solaris-form-suffix-action]"
    ngProjectAs="[solaris-form-suffix-action]"
  />
  <ng-content
    select="[solaris-form-suffix]"
    ngProjectAs="[solaris-form-suffix]"
  />
  <ng-content
    select="[solaris-form-label-action]"
    ngProjectAs="[solaris-form-label-action]"
  />
  <input
    [id]="id"
    type="text"
    #inputElement
    solaris-input
    autocomplete="off"
    inputmode="numeric"
    [density]="effectiveDensity()"
    [size]="size()"
    (blur)="onInputBlur()"
    [value]="displayValue()"
    (focus)="onInputFocus()"
    (input)="onInput($event)"
    (keydown)="onInputKeydown($event)"
    (click)="$event.stopPropagation()"
    [disabled]="isEffectivelyDisabled()"
    [readonly]="isEffectivelyReadonly()"
    [attr.placeholder]="placeholderText()"
    [attr.aria-describedby]="describedByIds.join(' ') || null"
  />

  <ng-template #calendarTriggerTemplate>
    <button
      type="button"
      appearance="ghost"
      solaris-icon-button
      solaris-form-suffix
      solaris-form-suffix-action
      class="solaris-date-picker__calendar-trigger"
      [size]="size()"
      [density]="effectiveDensity()"
      [attr.aria-label]="calendarButtonLabelText()"
      [disabled]="isEffectivelyDisabled() || isEffectivelyReadonly()"
    >
      <solaris-icon name="calendar" [decorative]="true" />
    </button>
  </ng-template>
  <ng-template #clearTemplate>
    <button
      type="button"
      solaris-form-suffix
      class="solaris-date-picker__clear"
      [attr.aria-label]="clearAriaLabel()"
      [disabled]="isEffectivelyDisabled() || isEffectivelyReadonly()"
      [hidden]="!canClear() || loading()"
      (click)="clearValue(); $event.stopPropagation()"
      tabindex="-1"
    >
      <solaris-icon name="x" [decorative]="true" />
    </button>
  </ng-template>
</solaris-form-field>

<ng-template #calendarPopover="solarisPopover" solaris-popover>
  <div
    role="dialog"
    class="solaris-date-picker__panel"
    [attr.aria-label]="calendarButtonLabelText()"
  >
    <solaris-date-calendar
      [min]="min()"
      [max]="max()"
      [selected]="value()"
      [month]="displayedMonth()"
      [locale]="resolvedLocale()"
      [disabledDates]="disabledDates()"
      [weekStartsOn]="weekStartsOn()"
      [disablePast]="disablePast()"
      [disableFuture]="disableFuture()"
      [nextMonthLabel]="nextMonthLabel()"
      (selectedChange)="selectDate($event)"
      (monthChange)="setDisplayedMonth($event)"
      [previousMonthLabel]="previousMonthLabel()"
    />
  </div>
</ng-template>
