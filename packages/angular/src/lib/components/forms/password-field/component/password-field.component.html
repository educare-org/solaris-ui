<solaris-form-field
  [control]="this"
  [hint]="hint()"
  [label]="label()"
  [radius]="radius()"
  [density]="effectiveDensity()"
  [size]="size()"
  [hintKey]="hintKey()"
  [labelKey]="labelKey()"
  [errorKey]="errorKey()"
  [required]="requiredInput()"
  [optional]="optional()"
  [readonly]="readonlyInput()"
  [appearance]="appearance()"
  [invalid]="isFieldInvalid()"
  [error]="error() || computedError()"
  [disabled]="isEffectivelyDisabled()"
  [loading]="loading()"
  [hasPrefix]="hasPrefix()"
  [hasSuffix]="hasSuffix()"
  [hasSuffixAction]="!!projectedSuffixAction()"
>
  <ng-content
    select="[solaris-form-prefix]"
    ngProjectAs="[solaris-form-prefix]"
  />
  <ng-content
    select="[solaris-form-suffix-action]"
    ngProjectAs="[solaris-form-suffix-action]"
  />
  <ng-content
    select="[solaris-form-suffix]"
    ngProjectAs="[solaris-form-suffix]"
  />
  <ng-content
    select="[solaris-form-label-action]"
    ngProjectAs="[solaris-form-label-action]"
  />
  @if (prefix() && !projectedPrefix()) {
    <span solaris-form-prefix>
      <solaris-icon [name]="prefix() ?? ''" [decorative]="true" />
    </span>
  }
  <input
    #inputElement
    solaris-input
    [type]="inputType()"
    [density]="effectiveDensity()"
    [size]="size()"
    (blur)="onInputBlur()"
    [readonly]="readonlyInput()"
    [attr.id]="fieldId() ?? null"
    [attr.aria-describedby]="ariaDescribedBy()"
    (focus)="onInputFocus()"
    [value]="internalValue()"
    (input)="onInput($event)"
    [attr.name]="name() ?? null"
    [disabled]="isEffectivelyDisabled()"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.placeholder]="placeholderText() || null"
    [attr.maxlength]="maxLength() ?? null"
  />
  @if (suffix() && !projectedSuffix()) {
    <span solaris-form-suffix>
      <solaris-icon [name]="suffix() ?? ''" [decorative]="true" />
    </span>
  }
  @if (showToggle()) {
    <button
      type="button"
      solaris-form-suffix
      solaris-form-suffix-action
      (click)="toggleVisibility()"
      [attr.aria-label]="toggleLabel()"
      [disabled]="isEffectivelyDisabled()"
      class="solaris-password-field__toggle"
    >
      <solaris-icon
        [decorative]="true"
        [name]="_visibleState() ? 'eye-off' : 'eye'"
      />
    </button>
  }
</solaris-form-field>

@if (showRequirements() && effectivePolicy()) {
  <div class="solaris-password-field__requirements" role="list">
    @for (req of requirementList(); track req.key) {
      <div
        class="solaris-password-field__requirement"
        role="listitem"
        [attr.data-met]="req.met"
      >
        <solaris-icon
          class="solaris-password-field__requirement-icon"
          [name]="req.met ? 'check' : 'x'"
          [decorative]="true"
        />
        <span class="solaris-password-field__requirement-label">
          {{ req.label }}
        </span>
      </div>
    }
  </div>
}

<div
  class="solaris-password-field__strength"
  [hidden]="!(showStrength() && internalValue().length > 0)"
  [attr.data-level]="strengthLevel()"
  role="status"
  aria-live="polite"
>
  <div class="solaris-password-field__strength-bar">
    <div
      class="solaris-password-field__strength-segment"
      [attr.data-active]="strengthLevel() !== 'empty'"
    ></div>
    <div
      class="solaris-password-field__strength-segment"
      [attr.data-active]="
        strengthLevel() === 'medium' || strengthLevel() === 'strong'
      "
    ></div>
    <div
      class="solaris-password-field__strength-segment"
      [attr.data-active]="strengthLevel() === 'strong'"
    ></div>
  </div>
  <span class="solaris-password-field__strength-label">
    {{ strengthLabelText() }}
  </span>
</div>
