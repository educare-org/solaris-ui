<solaris-form-field
  [hint]="hint()"
  [label]="label()"
  [radius]="radius()"
  [density]="density()"
  [hintKey]="hintKey()"
  [labelKey]="labelKey()"
  [errorKey]="errorKey()"
  [required]="required()"
  [optional]="optional()"
  [readonly]="readonly()"
  [appearance]="appearance()"
  [invalid]="isFieldInvalid()"
  [error]="error() || computedError()"
  [disabled]="isEffectivelyDisabled()"
>
  <input
    #inputElement
    solaris-input
    [type]="inputType()"
    [density]="density()"
    (blur)="onInputBlur()"
    [readonly]="readonly()"
    [attr.id]="id() ?? null"
    (focus)="onInputFocus()"
    [value]="internalValue()"
    (input)="onInput($event)"
    [attr.name]="name() ?? null"
    [disabled]="isEffectivelyDisabled()"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.placeholder]="placeholderText() || null"
    [attr.maxlength]="maxLength() ?? null"
  />
  @if (showToggle()) {
    <button
      type="button"
      solaris-form-suffix
      (click)="toggleVisibility()"
      [attr.aria-label]="toggleLabel()"
      [disabled]="isEffectivelyDisabled()"
      class="solaris-password-field__toggle"
    >
      <solaris-icon
        [decorative]="true"
        [name]="_visibleState() ? 'eye-off' : 'eye'"
      />
    </button>
  }
</solaris-form-field>

@if (showRequirements() && effectivePolicy(); as p) {
  <div class="solaris-password-field__requirements" role="list">
    @for (req of requirementList(); track req.key) {
      <div
        class="solaris-password-field__requirement"
        role="listitem"
        [attr.data-met]="req.met"
      >
        <solaris-icon
          class="solaris-password-field__requirement-icon"
          [name]="req.met ? 'check' : 'x'"
          [decorative]="true"
        />
        <span class="solaris-password-field__requirement-label">
          {{ req.label }}
        </span>
      </div>
    }
  </div>
}

@if (showStrength() && internalValue().length > 0) {
  <div
    class="solaris-password-field__strength"
    [attr.data-level]="strengthLevel()"
    role="status"
    aria-live="polite"
  >
    <div class="solaris-password-field__strength-bar">
      <div
        class="solaris-password-field__strength-segment"
        [attr.data-active]="strengthLevel() !== 'empty'"
      ></div>
      <div
        class="solaris-password-field__strength-segment"
        [attr.data-active]="
          strengthLevel() === 'medium' || strengthLevel() === 'strong'
        "
      ></div>
      <div
        class="solaris-password-field__strength-segment"
        [attr.data-active]="strengthLevel() === 'strong'"
      ></div>
    </div>
    <span class="solaris-password-field__strength-label">
      {{ strengthLabelText() }}
    </span>
  </div>
}
