<label class="solaris-switch__label" [for]="elementId()">
  <input
    type="checkbox"
    role="switch"
    class="solaris-switch__input"
    [id]="elementId()"
    [checked]="_checked()"
    [disabled]="isEffectivelyDisabled()"
    [required]="required"
    [attr.aria-label]="effectiveAriaLabel() ?? null"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-checked]="_checked() ? 'true' : 'false'"
    [attr.aria-required]="requiredInput() ? 'true' : null"
    [attr.aria-invalid]="isEffectivelyInvalid() ? 'true' : null"
    [attr.name]="name() ?? null"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
    #inputElement
  />
  <span class="solaris-switch__track" aria-hidden="true">
    <span class="solaris-switch__thumb">
      @if (thumbIcon(); as iconName) {
        <solaris-icon [name]="iconName" [decorative]="true" />
      } @else if (thumbText(); as thumbLabel) {
        <span class="solaris-switch__thumb-text">{{ thumbLabel }}</span>
      }
    </span>
  </span>
  @if (hasProjectedContent() || labelText() || descriptionText()) {
    <span class="solaris-switch__content">
      @if (hasProjectedContent()) {
        <span class="solaris-switch__label-text" [id]="elementId() + '-label'">
          <ng-content />
          @if (requiredInput()) {
            <span class="solaris-switch__required" aria-hidden="true">*</span>
          }
        </span>
      } @else if (labelText(); as text) {
        <span class="solaris-switch__label-text" [id]="elementId() + '-label'">
          {{ text }}
          @if (requiredInput()) {
            <span class="solaris-switch__required" aria-hidden="true">*</span>
          }
        </span>
      }
      @if (descriptionText(); as description) {
        <span class="solaris-switch__description" [id]="descriptionId()">
          {{ description }}
        </span>
      }
    </span>
  }
</label>
