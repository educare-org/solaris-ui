<label class="solaris-radio__label" [for]="elementId()">
  <input
    type="radio"
    class="solaris-radio__input"
    [id]="elementId()"
    [checked]="_checked()"
    [disabled]="isEffectivelyDisabled()"
    [required]="required"
    [attr.aria-label]="effectiveAriaLabel() ?? null"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-invalid]="isEffectivelyInvalid() ? 'true' : null"
    [attr.name]="effectiveName() ?? null"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
    #inputElement
  />
  <span class="solaris-radio__control" aria-hidden="true">
    @if (_checked()) {
      <span class="solaris-radio__dot"></span>
    }
  </span>
  @if (hasProjectedContent() || labelText() || descriptionText()) {
    <span class="solaris-radio__content">
      @if (hasProjectedContent()) {
        <span class="solaris-radio__label-text" [id]="elementId() + '-label'">
          <ng-content />
        </span>
      } @else if (labelText(); as text) {
        <span class="solaris-radio__label-text" [id]="elementId() + '-label'">
          {{ text }}
        </span>
      }
      @if (descriptionText(); as description) {
        <span class="solaris-radio__description" [id]="descriptionId()">
          {{ description }}
        </span>
      }
    </span>
  }
</label>
