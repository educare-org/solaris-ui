@if (labelText(); as text) {
  <span class="solaris-switch-group__label" [id]="labelId()">
    {{ text }}
  </span>
}
<div class="solaris-switch-group__options" role="presentation">
  <ng-content />
</div>
@if (hintText(); as text) {
  <p class="solaris-switch-group__hint" [id]="hintId()">
    {{ text }}
  </p>
}
@if (showError(); as text) {
  <p class="solaris-switch-group__error" [id]="errorId()" role="alert">
    {{ text }}
  </p>
}
