<solaris-form-field
  [hint]="hint()"
  [label]="label()"
  [radius]="radius()"
  [density]="density()"
  [hintKey]="hintKey()"
  [labelKey]="labelKey()"
  [errorKey]="errorKey()"
  [required]="required()"
  [optional]="optional()"
  [readonly]="readonly()"
  [appearance]="appearance()"
  [invalid]="isFieldInvalid()"
  [error]="error() || computedError()"
  [disabled]="isEffectivelyDisabled()"
>
  <ng-content select="[solaris-form-prefix]" />
  <input
    type="email"
    #inputElement
    solaris-input
    data-bwignore="true"
    [density]="density()"
    (blur)="onInputBlur()"
    [readonly]="readonly()"
    (focus)="onInputFocus()"
    [attr.id]="id() ?? null"
    (input)="onInput($event)"
    [value]="internalValue()"
    [attr.inputmode]="'email'"
    [attr.spellcheck]="'false'"
    [attr.name]="name() ?? null"
    [attr.autocapitalize]="'none'"
    [attr.autocomplete]="autocomplete()"
    [disabled]="isEffectivelyDisabled()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.placeholder]="placeholderText() || null"
  />
  <ng-content select="[solaris-form-suffix]" />
</solaris-form-field>
