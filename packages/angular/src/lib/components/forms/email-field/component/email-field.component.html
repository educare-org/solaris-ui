<solaris-form-field
  [control]="this"
  [hint]="hint()"
  [label]="label()"
  [radius]="radius()"
  [density]="effectiveDensity()"
  [size]="size()"
  [hintKey]="hintKey()"
  [labelKey]="labelKey()"
  [errorKey]="errorKey()"
  [required]="requiredInput()"
  [optional]="optional()"
  [readonly]="readonlyInput()"
  [appearance]="appearance()"
  [invalid]="isFieldInvalid()"
  [error]="error() || computedError()"
  [disabled]="isEffectivelyDisabled()"
  [loading]="loading()"
  [hasPrefix]="hasPrefix()"
  [hasSuffix]="hasSuffix()"
  [hasSuffixAction]="!!projectedSuffixAction()"
>
  @if (prefix() && !projectedPrefix()) {
    <span solaris-form-prefix>
      <solaris-icon [name]="prefix() ?? ''" [decorative]="true" />
    </span>
  }
  <ng-content
    select="[solaris-form-prefix]"
    ngProjectAs="[solaris-form-prefix]"
  />
  <input
    type="email"
    #inputElement
    solaris-input
    data-bwignore="true"
    [density]="effectiveDensity()"
    [size]="size()"
    (blur)="onInputBlur()"
    [readonly]="readonlyInput()"
    (focus)="onInputFocus()"
    [attr.id]="fieldId() ?? null"
    [attr.aria-describedby]="ariaDescribedBy()"
    (input)="onInput($event)"
    [value]="internalValue()"
    [attr.inputmode]="'email'"
    [attr.spellcheck]="'false'"
    [attr.name]="name() ?? null"
    [attr.autocapitalize]="'none'"
    [attr.autocomplete]="autocomplete()"
    [disabled]="isEffectivelyDisabled()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.placeholder]="placeholderText() || null"
  />
  @if (canClear() && !loading()) {
    <button
      type="button"
      solaris-form-suffix
      class="solaris-email-field__clear"
      [attr.aria-label]="clearAriaLabel()"
      [disabled]="isEffectivelyDisabled() || readonlyInput()"
      (click)="clearValue(); $event.stopPropagation()"
      tabindex="-1"
    >
      <solaris-icon name="x" [decorative]="true" />
    </button>
  }
  @if (suffix() && !projectedSuffix()) {
    <span solaris-form-suffix>
      <solaris-icon [name]="suffix() ?? ''" [decorative]="true" />
    </span>
  }
  <ng-content
    select="[solaris-form-suffix][solaris-form-suffix-action]"
    ngProjectAs="[solaris-form-suffix-action]"
  />
  <ng-content
    select="[solaris-form-suffix]"
    ngProjectAs="[solaris-form-suffix]"
  />
  <ng-content
    select="[solaris-form-label-action]"
    ngProjectAs="[solaris-form-label-action]"
  />
</solaris-form-field>
