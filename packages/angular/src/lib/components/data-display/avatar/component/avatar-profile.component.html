@if (isLink()) {
  <a
    class="solaris-avatar-profile__identity"
    [href]="href()"
    [attr.target]="target()"
    [attr.rel]="linkRel()"
    [attr.aria-label]="resolvedActionLabel()"
    (click)="onIdentityClick()"
  >
    <ng-container *ngTemplateOutlet="identity" />
  </a>
} @else if (isButton()) {
  <button
    type="button"
    class="solaris-avatar-profile__identity"
    [attr.aria-label]="resolvedActionLabel()"
    (click)="onIdentityClick()"
  >
    <ng-container *ngTemplateOutlet="identity" />
  </button>
} @else {
  <ng-container *ngTemplateOutlet="identity" />
}

<ng-template #identity>
  <solaris-avatar
    [src]="src()"
    [srcset]="srcset()"
    [name]="name()"
    [userId]="userId()"
    [size]="size()"
    [status]="status()"
    [showStatus]="showStatus()"
    [verified]="verified()"
    [count]="count()"
    [max]="max()"
    [showZero]="showZero()"
  />
  @if (!compact()) {
    <span class="solaris-avatar-profile__text">
      <span class="solaris-avatar-profile__title-row">
        <span
          class="solaris-avatar-profile__title"
          [attr.title]="titleTooltip()"
          >{{ resolvedTitle() }}</span
        >
        @if (resolvedBadgeText()) {
          <solaris-badge size="sm" color="primary">{{
            resolvedBadgeText()
          }}</solaris-badge>
        }
      </span>
      @if (resolvedSubtitle()) {
        <span
          class="solaris-avatar-profile__subtitle"
          [attr.title]="subtitleTooltip()"
          >{{ resolvedSubtitle() }}</span
        >
      }
    </span>
  }
</ng-template>

<span class="solaris-avatar-profile__actions">
  <ng-content select="[solaris-avatar-profile-actions]" />
</span>
