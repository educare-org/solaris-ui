<div class="solaris-dialog-header__start">
  <div class="solaris-dialog-header__row">
    @if (hasIcon()) {
      <div class="solaris-dialog-header__icon">
        <solaris-icon [name]="icon()!" [decorative]="iconDecorative()" />
      </div>
    }

    @if (hasTitle()) {
      <h2 class="solaris-dialog-header__title" [attr.id]="titleId">
        {{ resolvedTitle() }}
      </h2>
    }

    @if (showClose()) {
      <button
        type="button"
        data-dialog-close
        (click)="closeDialog()"
        [attr.aria-label]="resolvedCloseLabel()"
        class="solaris-dialog-header__close"
      >
        <solaris-icon name="x" [decorative]="true" />
      </button>
    }
  </div>

  @if (hasDescription()) {
    <p class="solaris-dialog-header__description" [attr.id]="descriptionId">
      {{ resolvedDescription() }}
    </p>
  }
</div>
