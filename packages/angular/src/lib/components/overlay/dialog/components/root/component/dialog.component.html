<solaris-dialog-header
  [icon]="icon()"
  [title]="resolvedTitle()"
  [variant]="variant()"
  [description]="resolvedDescription()"
  [separator]="headerSeparator()"
  [iconDecorative]="iconDecorative()"
  [closeable]="closeable()"
  [closeLabel]="resolvedCloseLabel()"
  [scrolled]="bodyScrolled()"
/>

@if (resolvedDescription() && !hasActions()) {
  <solaris-dialog-content [density]="density()">
    <p class="solaris-dialog__description-text">{{ resolvedDescription() }}</p>
  </solaris-dialog-content>
}

@if (hasActions()) {
  <div class="solaris-dialog__body"></div>
  <solaris-dialog-actions
    [actions]="actions()"
    [align]="actionsAlign()"
    [stack]="actionsStack()"
    [separator]="footerSeparator()"
    [density]="density()"
    [scrolled]="bodyHasMoreBelow()"
  />
}
