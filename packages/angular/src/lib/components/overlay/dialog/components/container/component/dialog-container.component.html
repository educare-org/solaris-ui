<div
  class="solaris-dialog-backdrop"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown.escape)="onBackdropClick($event)"
>
  <div
    #dialogPanel
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="false"
    [attr.role]="dialogRole"
    [attr.aria-label]="panelAriaLabel"
    [attr.aria-labelledby]="panelAriaLabelledBy"
    [attr.aria-describedby]="panelAriaDescribedBy"
    [style.width]="panelWidth"
    class="solaris-dialog-panel"
    [style.height]="panelHeight"
    [style.min-width]="panelMinWidth"
    [style.max-width]="panelMaxWidth"
    [style.min-height]="panelMinHeight"
    [style.max-height]="panelMaxHeight"
    [attr.aria-modal]="hasBackdrop ? 'true' : 'false'"
  >
    @if (isSimpleMode) {
      <solaris-dialog [options]="simpleOptions()!" />
    } @else {
      @if (hasChromeHeader) {
        <solaris-dialog-header
          [icon]="chromeIcon"
          [title]="chromeTitle"
          [variant]="chromeVariant"
          [description]="chromeDescription"
          [separator]="chromeHeaderSeparator"
          [iconDecorative]="chromeIconDecorative"
          [closeable]="closeable"
          [closeLabel]="resolvedCloseLabel"
          [scrolled]="panelScrolled()"
        />
      }
      <div class="solaris-dialog-panel__body" (scroll)="onPanelBodyScroll()">
        <ng-template #componentHost></ng-template>
      </div>
      @if (hasChromeActions) {
        <solaris-dialog-actions
          [actions]="chromeActions"
          [align]="chromeActionsAlign"
          [stack]="chromeActionsStack"
          [separator]="chromeFooterSeparator"
          [density]="chromeDensity"
          [scrolled]="panelHasMoreBelow()"
        />
      }
    }
    @if (showFloatingClose) {
      <button
        type="button"
        data-dialog-close
        (click)="closeDialog()"
        [attr.aria-label]="resolvedCloseLabel"
        class="solaris-dialog-container__close"
      >
        <solaris-icon name="x" [decorative]="true" />
      </button>
    }
  </div>
</div>
