@if (hasLeadingContent()) {
  <div class="solaris-dropdown-menu-item__leading">
    @if (type() === 'checkbox') {
      <span
        aria-hidden="true"
        class="solaris-dropdown-menu-item__checkbox"
        [class.solaris-dropdown-menu-item__checkbox--checked]="checked()"
      >
        @if (checked()) {
          <span class="solaris-dropdown-menu-item__checkbox-icon">
            <solaris-icon name="check" [decorative]="true" />
          </span>
        }
      </span>
    } @else if (type() === 'radio') {
      <span
        aria-hidden="true"
        class="solaris-dropdown-menu-item__radio"
        [class.solaris-dropdown-menu-item__radio--checked]="checked()"
      >
        @if (checked()) {
          <span class="solaris-dropdown-menu-item__radio-dot"></span>
        }
      </span>
    } @else {
      <solaris-icon [name]="icon()!" [decorative]="iconDecorative()" />
    }
  </div>
}
<div class="solaris-dropdown-menu-item__content">
  @if (resolvedLabel()) {
    <span class="solaris-dropdown-menu-item__label">{{ resolvedLabel() }}</span>
  }
  @if (resolvedDescription()) {
    <span class="solaris-dropdown-menu-item__description">
      {{ resolvedDescription() }}
    </span>
  }
</div>
@if (shortcut()) {
  <span class="solaris-dropdown-menu-item__shortcut" aria-hidden="true">
    {{ shortcut() }}
  </span>
}
