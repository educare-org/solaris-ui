<div
  class="solaris-popover-panel__container"
  [attr.data-appearance]="data.appearance"
  [attr.data-padding]="data.padding"
  [attr.data-radius]="data.radius"
  [attr.data-connected-side]="data.connectedSide ?? null"
  [attr.role]="data.role"
  [id]="data.panelId"
  tabindex="-1"
>
  <ng-container *ngTemplateOutlet="data.contentTemplate" />
</div>
