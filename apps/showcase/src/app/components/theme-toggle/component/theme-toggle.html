<div class="theme-toggle" [attr.data-full-width]="fullWidth() || undefined">
  @if (showScheme()) { @if (schemeDisplay() === 'labels') {
  <solaris-segmented-control
    [size]="size()"
    [density]="density()"
    radius="md"
    appearance="outline"
    [value]="baseTheme()"
    [fullWidth]="fullWidth()"
    ariaLabelKey="shell.theme.label"
    (valueChange)="setTheme($event)"
  >
    <solaris-segmented-item value="light" labelKey="shell.theme.light-short" />
    <solaris-segmented-item value="dark" labelKey="shell.theme.dark-short" />
    <solaris-segmented-item
      value="system"
      labelKey="shell.theme.system-short"
    />
  </solaris-segmented-control>
  } @else {
  <solaris-segmented-control
    [size]="size()"
    [density]="density()"
    radius="md"
    appearance="outline"
    [value]="baseTheme()"
    [fullWidth]="fullWidth()"
    ariaLabelKey="shell.theme.label"
    (valueChange)="setTheme($event)"
  >
    <solaris-segmented-item
      icon="sun"
      value="light"
      ariaLabelKey="shell.theme.light"
    />
    <solaris-segmented-item
      icon="moon"
      value="dark"
      ariaLabelKey="shell.theme.dark"
    />
    <solaris-segmented-item
      value="system"
      icon="monitor"
      ariaLabelKey="shell.theme.system"
    />
  </solaris-segmented-control>
  } } @if (showHighContrast()) {
  <button
    size="md"
    radius="md"
    type="button"
    color="neutral"
    solaris-icon-button
    appearance="outline"
    [pressed]="highContrast()"
    [attr.aria-label]="'shell.theme.high-contrast' | translate"
    [attr.title]="'shell.theme.high-contrast' | translate"
    (click)="toggleHighContrast()"
  >
    <solaris-icon name="contrast" [decorative]="true" />
  </button>
  }
</div>
