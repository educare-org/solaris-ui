<solaris-segmented-control
  size="md"
  radius="sm"
  appearance="outline"
  [value]="activeTheme()"
  ariaLabelKey="shell.theme.label"
  (valueChange)="setTheme($event)"
>
  <solaris-segmented-item
    icon="sun"
    value="light"
    ariaLabelKey="shell.theme.light"
  />
  <solaris-segmented-item
    icon="moon"
    value="dark"
    ariaLabelKey="shell.theme.dark"
  />
  <solaris-segmented-item
    value="system"
    icon="monitor"
    ariaLabelKey="shell.theme.system"
  />
  <solaris-segmented-item value="high-contrast" ariaLabel="High contrast">
    HC
  </solaris-segmented-item>
  <solaris-segmented-item
    value="high-contrast-dark"
    ariaLabel="High contrast dark"
  >
    HC dark
  </solaris-segmented-item>
</solaris-segmented-control>
