<div class="theme-toggle" role="radiogroup" aria-label="Theme">
  <button
    class="theme-toggle__btn"
    [class.theme-toggle__btn--active]="activeTheme === 'light'"
    (click)="setTheme('light')"
    role="radio"
    [attr.aria-checked]="activeTheme === 'light'"
    aria-label="Light theme"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2" />
      <path d="M12 20v2" />
      <path d="M5 5l1.5 1.5" />
      <path d="M17.5 17.5L19 19" />
      <path d="M2 12h2" />
      <path d="M20 12h2" />
      <path d="M5 19l1.5-1.5" />
      <path d="M17.5 6.5L19 5" />
    </svg>
  </button>
  <button
    class="theme-toggle__btn"
    [class.theme-toggle__btn--active]="activeTheme === 'dark'"
    (click)="setTheme('dark')"
    role="radio"
    [attr.aria-checked]="activeTheme === 'dark'"
    aria-label="Dark theme"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
    </svg>
  </button>
  <button
    class="theme-toggle__btn"
    [class.theme-toggle__btn--active]="activeTheme === 'system'"
    (click)="setTheme('system')"
    role="radio"
    [attr.aria-checked]="activeTheme === 'system'"
    aria-label="System theme"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
      <path d="M8 21h8" />
      <path d="M12 17v4" />
    </svg>
  </button>
</div>
