<solaris-segmented-control
  size="sm"
  radius="full"
  density="compact"
  appearance="outline"
  [value]="activeTheme"
  (valueChange)="setTheme($event)"
>
  <solaris-segmented-item value="light" icon="sun" />
  <solaris-segmented-item value="dark" icon="moon" />
  <solaris-segmented-item value="system" icon="monitor" />
</solaris-segmented-control>
