<header class="shell-header">
  @if (isMobile()) {
  <span class="shell-header__menu-spacer" aria-hidden="true"></span>
  }

  <a
    routerLink="/"
    class="shell-header__brand"
    [attr.aria-label]="'shell.brand.home' | translate"
  >
    <span class="shell-header__brand-mark" aria-hidden="true"></span>
    <span class="shell-header__brand-name"
      >{{ 'shell.brand.name' | translate }}</span
    >
  </a>

  @if (!isMobile()) {
  <div class="shell-header__actions">
    <solaris-form-field density="compact" prefix="search">
      <input
        radius="md"
        type="search"
        solaris-input
        [value]="searchQuery()"
        [attr.aria-label]="'shell.search.label' | translate"
        (keydown.escape)="clearSearch()"
        (input)="searchQuery.set($any($event.target).value)"
        [placeholder]="'shell.search.placeholder' | translate"
      />
    </solaris-form-field>

    <app-theme-toggle [showHighContrast]="false" />
  </div>

  <app-theme-toggle class="shell-header__contrast" [showScheme]="false" />
  } @else {
  <span class="shell-header__contrast-spacer" aria-hidden="true"></span>
  }
</header>
