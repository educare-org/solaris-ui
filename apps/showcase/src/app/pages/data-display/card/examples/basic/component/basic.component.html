<solaris-card padding="md">
  <div solaris-card-header>
    <h3 solaris-card-title>{{ 'card.example.basic.title' | translate }}</h3>
    <p solaris-card-description>
      {{ 'card.example.basic.description' | translate }}
    </p>
  </div>
  <div solaris-card-content>
    <solaris-badge color="primary">
      {{ 'card.example.basic.badge' | translate }}
    </solaris-badge>
  </div>
  <div solaris-card-footer>
    <span>{{ 'card.example.basic.comments' | translate }}</span>
    <span>{{ 'card.example.basic.tomorrow' | translate }}</span>
  </div>
</solaris-card>
