<solaris-card mediaPosition="start" padding="md">
  <figure solaris-card-media>
    <div
      class="side-media-card-example__placeholder"
      role="img"
      [attr.aria-label]="'card.example.media.preview' | translate"
    ></div>
  </figure>
  <div solaris-card-content>
    <h3 solaris-card-title>{{ 'card.example.media.title' | translate }}</h3>
    <p solaris-card-description>
      {{ 'card.example.media.description' | translate }}
    </p>
  </div>
</solaris-card>
