<app-docs-page-layout [items]="tocItems">
  <app-docs-page-header
    titleKey="print-view.title"
    descriptionKey="print-view.description"
    [breadcrumbs]="breadcrumbs"
    [prev]="prev"
    [next]="next"
    [copyable]="true"
    (copyPage)="copyPageAsMarkdown()"
    (viewMarkdown)="downloadPageAsMarkdown()"
    (openChatGpt)="openInChatGpt()"
    (openClaude)="openInClaude()"
  />

  <app-docs-section anchor="examples" titleKey="print-view.section.examples">
    <p class="print-showcase__note">
      {{ 'print-view.examples.note' | translate }}
    </p>
    <solaris-preview-code [code]="basicCode" language="html">
      <button
        type="button"
        class="print-showcase__print-button"
        (click)="printPreview()"
      >
        {{ 'print-view.print.button' | translate }}
      </button>
      <div class="print-showcase__preview">
        <solaris-calendar-month-view
          locale="pt-BR"
          timeZone="America/Sao_Paulo"
          [focusedDate]="focusedDate()"
          (focusedDateChange)="focusedDate.set($event)"
          [events]="events"
          [holidays]="holidays()"
        />
        <solaris-calendar-schedule-view
          locale="pt-BR"
          timeZone="America/Sao_Paulo"
          [focusedDate]="focusedDate()"
          (focusedDateChange)="focusedDate.set($event)"
          [windowDays]="7"
          [events]="events"
          [holidays]="holidays()"
        />
      </div>
    </solaris-preview-code>
  </app-docs-section>

  <app-docs-section
    anchor="installation"
    titleKey="print-view.section.installation"
  >
    <p class="print-showcase__note">
      {{ 'print-view.installation.note' | translate }}
    </p>
    <solaris-code-block variant="command" [commands]="installCommands" />
    <solaris-code-block [code]="importCode" language="typescript" />
  </app-docs-section>

  <app-docs-section anchor="props" titleKey="print-view.section.props">
    <p class="print-showcase__note">
      {{ 'print-view.props.note' | translate }}
    </p>
  </app-docs-section>

  <app-docs-page-footer [prev]="prev" [next]="next" />
</app-docs-page-layout>
