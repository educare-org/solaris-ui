<form [formGroup]="formGroup">
  <solaris-otp-input
    formControlName="code"
    [maxLength]="6"
    [required]="true"
    [label]="'otp-input.form.label' | translate"
    [hint]="'otp-input.form.hint' | translate"
    (completed)="onCompleted()"
  />
</form>
<p class="reactive-otp-input-example__note">
  {{
    'otp-input.form.status'
      | translate
        : {
            valid: formGroup.valid,
            touched: formGroup.touched,
            value: codeDisplayValue,
          }
  }}
</p>
@if (completed) {
  <p class="reactive-otp-input-example__note">
    {{ 'otp-input.form.completed' | translate }}
  </p>
}
