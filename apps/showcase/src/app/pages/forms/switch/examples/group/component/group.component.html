<solaris-switch-group
  size="lg"
  density="compact"
  ariaLabel="Notification channels"
>
  <!-- Email inherits size="lg" and density="compact" from the group -->
  <solaris-switch value="email">Email</solaris-switch>
  <!-- SMS overrides size, keeps the group density -->
  <solaris-switch value="sms" size="sm">SMS</solaris-switch>
</solaris-switch-group>
