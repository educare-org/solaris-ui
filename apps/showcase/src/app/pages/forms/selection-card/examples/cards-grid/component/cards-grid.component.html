<solaris-radio-group
  [formControl]="planControl"
  layout="grid"
  columns="auto"
  ariaLabel="Plan"
>
  <solaris-selection-card value="basic" color="primary">
    <h3>Basic</h3>
    <p>For small teams getting started.</p>
  </solaris-selection-card>
  <solaris-selection-card value="pro" color="primary">
    <h3>Pro</h3>
    <p>For growing teams.</p>
  </solaris-selection-card>
  <solaris-selection-card value="enterprise" color="primary">
    <h3>Enterprise</h3>
    <p>For large organizations.</p>
  </solaris-selection-card>
</solaris-radio-group>
