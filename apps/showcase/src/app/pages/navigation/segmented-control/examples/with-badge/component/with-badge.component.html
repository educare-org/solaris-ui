<solaris-segmented-control [(value)]="filter">
  <solaris-segmented-item value="all">{{ 'segmented-control.example.with-badge.all' | translate }}</solaris-segmented-item>
  <solaris-segmented-item value="issues">
    {{ 'segmented-control.example.with-badge.issues' | translate }}
    <solaris-badge size="sm" color="neutral">30</solaris-badge>
  </solaris-segmented-item>
  <solaris-segmented-item value="prs">
    {{ 'segmented-control.example.with-badge.pull-requests' | translate }}
    <solaris-badge size="sm" color="neutral">12</solaris-badge>
  </solaris-segmented-item>
</solaris-segmented-control>
