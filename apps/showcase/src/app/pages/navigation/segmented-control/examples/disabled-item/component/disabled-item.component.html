<solaris-segmented-control [(value)]="value">
  <solaris-segmented-item value="a">{{
    'segmented-control.example.disabled-item.enabled' | translate
  }}</solaris-segmented-item>
  <solaris-segmented-item value="b" [disabled]="true">{{
    'segmented-control.example.disabled-item.disabled' | translate
  }}</solaris-segmented-item>
  <solaris-segmented-item value="c">{{
    'segmented-control.example.disabled-item.enabled' | translate
  }}</solaris-segmented-item>
</solaris-segmented-control>
