<solaris-editable-tabs
  [tabs]="tabs()"
  [(value)]="activeTab"
  (tabRename)="onRename($event)"
  (tabRemove)="onRemove($event)"
  (tabMove)="onMove($event)"
  (defaultTabChange)="onDefaultChange($event)"
/>
<p
  style="
    margin-top: 16px;
    font-size: 14px;
    color: var(--solaris-neutral-text-secondary);
  "
>
  {{
    'editableTabs.example.basic.active-tab' | translate: { value: activeTab() }
  }}
</p>
