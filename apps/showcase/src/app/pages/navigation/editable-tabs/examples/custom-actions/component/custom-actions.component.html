<solaris-editable-tabs
  [tabs]="tabs"
  [(value)]="activeTab"
  (tabAction)="onAction($event)"
/>
<p
  style="
    margin-top: 8px;
    font-size: 12px;
    color: var(--solaris-neutral-text-secondary);
  "
>
  {{
    'editableTabs.example.custom-actions.last-action'
      | translate: { action: lastAction() }
  }}
</p>
