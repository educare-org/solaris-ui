<solaris-tabs [(value)]="activeTab">
  <solaris-tab value="code" icon="code">
    {{ 'tabs.example.icons-and-badges.tab-code' | translate }}
  </solaris-tab>
  <solaris-tab value="issues" icon="issue" [badge]="30">
    {{ 'tabs.example.icons-and-badges.tab-issues' | translate }}
  </solaris-tab>
  <solaris-tab value="pull-requests" icon="pull-request" [badge]="5">
    {{ 'tabs.example.icons-and-badges.tab-pull-requests' | translate }}
  </solaris-tab>
  <solaris-tab value="actions" icon="analytics">
    {{ 'tabs.example.icons-and-badges.tab-actions' | translate }}
  </solaris-tab>
</solaris-tabs>
